[workspace]
resolver = "2"
members = [
    "contracts/smart-account",
    "contracts/recovery-module",
    "contracts/policy-engine",
    "contracts/paymaster",
    "crates/novus-types",
]

[workspace.dependencies]
soroban-sdk = "22.0.0"
novus-types = { path = "crates/novus-types" }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
