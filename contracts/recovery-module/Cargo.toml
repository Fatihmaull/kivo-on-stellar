[package]
name = "novus-recovery-module"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
soroban-sdk = { workspace = true }
novus-types = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
# Real cross-contract recovery-flow tests deploy an actual smart-account
# instance rather than a stub, so this suite exercises the genuine
# is_guardian/get_config/rotate_credentials calls both contracts make.
novus-smart-account = { path = "../smart-account" }
